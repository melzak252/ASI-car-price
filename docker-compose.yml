services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Dane surowe + przetworzone
      - ./data:/app/data
      # Wytrenowane modele i preprocessor
      - ./models:/app/models
      # Raporty i metryki
      - ./reports:/app/reports
    environment:
      - MODEL_PATH=models/best_model.pkl
      - PREPROCESSOR_PATH=models/preprocessor.pkl
      - SELECTED_FEATURES_PATH=models/selected_feature_columns.joblib
      - PREDICTIONS_LOG_PATH=reports/predictions_log.csv
    # Szybki start – używamy gotowych modeli z hosta
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
